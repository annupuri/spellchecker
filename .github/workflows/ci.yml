name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build / test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the minimum the jar supports (maven.compiler.release);
        # 25 is the JDK used for development (.tool-versions).
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Compiles, runs the JUnit tests and builds the shaded jar.
      - name: mvn verify
        run: mvn -B -ntp verify
